<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Сесії сторінки тривог</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --line:#30363d; --ok:#3fb950; --warn:#e3b100; --bad:#ff7b72; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:860px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.15rem; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:.85rem; }
  [hidden] { display:none !important; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:.9rem; cursor:pointer; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .summary { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
  .pill { padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:.88rem; }
  .card { background:var(--card); border:1px solid var(--line); border-left-width:5px; border-radius:12px; padding:12px 14px; margin:10px 0; }
  .card.ok { border-left-color:var(--ok); }
  .card.problem { border-left-color:var(--warn); }
  .card.offline { border-left-color:var(--bad); }
  .card.closed { border-left-color:var(--line); opacity:.75; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .name { font-weight:600; }
  .status { font-size:.85rem; font-weight:600; }
  .card.ok .status { color:var(--ok); } .card.problem .status { color:var(--warn); }
  .card.offline .status { color:var(--bad); } .card.closed .status { color:var(--muted); }
  .meta { color:var(--muted); font-size:.82rem; margin:4px 0 8px; }
  .chip { display:inline-block; margin:2px 4px 2px 0; padding:3px 9px; border-radius:999px; font-size:.78rem; border:1px solid; }
  .chip.ok { color:var(--ok); border-color:#238636; background:rgba(35,134,54,.15); }
  .chip.bad { color:var(--bad); border-color:#da3633; background:rgba(218,54,51,.15); }
  .chip.off { color:var(--muted); border-color:var(--line); }
  .problems { color:var(--warn); font-size:.85rem; margin-top:6px; }
  .empty, .denied { color:var(--muted); text-align:center; padding:40px 0; }
  .denied { color:var(--bad); }
</style>
</head>
<body>
<main>
  <div class="denied" id="denied" hidden></div>
  <div id="app">
    <div class="top">
      <h1>Сесії сторінки тривог</h1>
      <button id="clearBtn">Прибрати закриті та без зв'язку</button>
    </div>
    <div class="muted" id="updated">Завантаження…</div>
    <div class="summary" id="summary"></div>
    <div id="list"></div>
  </div>
</main>

<script>
const key = new URLSearchParams(location.search).get('key') || '';
const $ = id => document.getElementById(id);
let timer = null;

function ago(sec) {
  if (sec < 60) return sec + ' с тому';
  if (sec < 3600) return Math.round(sec / 60) + ' хв тому';
  return Math.round(sec / 3600) + ' год тому';
}
function dur(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  return h ? h + ' год ' + m + ' хв' : (m || 1) + ' хв';
}
function browser(ua) {
  ua = ua || '';
  const b = /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /Firefox\//.test(ua) ? 'Firefox'
          : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Браузер';
  const o = /Windows/.test(ua) ? 'Windows' : /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android'
          : /Mac OS/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : '';
  return o ? b + ' · ' + o : b;
}
const STATUS = {ok: '🟢 Працює', problem: '🟡 Є проблеми', offline: '🔴 Не відповідає', closed: '⚪ Закрита'};

function chip(text, state) {
  const c = document.createElement('span');
  c.className = 'chip ' + state;
  c.textContent = (state === 'ok' ? '✓ ' : state === 'bad' ? '✕ ' : '– ') + text;
  return c;
}

function render(rows) {
  const count = s => rows.filter(r => r.status === s).length;
  const sum = $('summary'); sum.replaceChildren();
  for (const t of ['Всього: ' + rows.length, '🟢 Працює: ' + count('ok'), '🟡 З проблемами: ' + count('problem'),
                   '🔴 Не відповідає: ' + count('offline'), '⚪ Закрито: ' + count('closed')]) {
    const p = document.createElement('span'); p.className = 'pill'; p.textContent = t; sum.appendChild(p);
  }
  $('updated').textContent = 'Оновлюється кожні 5 секунд · ' + new Date().toLocaleTimeString('uk-UA');

  const list = $('list'); list.replaceChildren();
  if (!rows.length) {
    const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'Поки немає жодної сесії. Відкрийте головну сторінку.'; list.appendChild(e); return;
  }
  for (const r of rows) {
    const card = document.createElement('div'); card.className = 'card ' + r.status;
    const row = document.createElement('div'); row.className = 'row';
    const name = document.createElement('span'); name.className = 'name';
    name.textContent = r.named ? r.name : 'Без назви (вкладка #' + r.tab + ')';
    const st = document.createElement('span'); st.className = 'status';
    st.textContent = STATUS[r.status] + ' · сигнал ' + ago(r.age);
    row.append(name, st);

    const meta = document.createElement('div'); meta.className = 'meta';
    const live = r.status === 'ok' || r.status === 'problem';
    meta.textContent = [browser(r.ua), live ? 'відкрита ' + dur(r.uptime) : '', live && r.tabs > 1 ? 'вкладок: ' + r.tabs : '',
                        live && !r.visible ? 'у фоні' : '', r.standalone ? 'як застосунок' : ''].filter(Boolean).join(' · ');
    card.append(row, meta);

    if (live) {
      card.appendChild(chip('Звук: ' + (!r.sound ? 'вимкнено' : r.playing ? 'активний' : 'не грає'), r.sound && r.playing ? 'ok' : 'bad'));
      card.appendChild(chip('Екран: ' + (r.wake ? 'не гасне' : 'може згаснути'), r.wake ? 'ok' : 'off'));
      card.appendChild(chip('Захист від сну: ' + (r.lock ? 'активний' : 'немає'), r.lock ? 'ok' : 'bad'));
      card.appendChild(chip('Дані: ' + (r.data_age <= 30 ? 'свіжі' : 'немає ' + r.data_age + ' с'), r.data_age <= 30 ? 'ok' : 'bad'));
      if (r.problems && r.problems.length) {
        const pr = document.createElement('div'); pr.className = 'problems'; pr.textContent = '⚠️ ' + r.problems.join(', ');
        card.appendChild(pr);
      }
    }
    list.appendChild(card);
  }
}

async function load() {
  try {
    const r = await fetch('/api/sessions?key=' + encodeURIComponent(key), {cache: 'no-store'});
    if (r.status === 403) {
      clearInterval(timer);
      $('app').hidden = true; $('denied').hidden = false;
      $('denied').textContent = 'Доступ заборонено. Відкрийте адресу у форматі /sessions?key=ПАРОЛЬ';
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render((await r.json()).sessions);
  } catch (e) {
    $('updated').textContent = 'Немає зв\'язку із сервером… повторюю.';
  }
}

$('clearBtn').onclick = async () => {
  await fetch('/api/sessions/clear?key=' + encodeURIComponent(key), {method: 'POST'}).catch(() => {});
  load();
};

load();
timer = setInterval(load, 5000);
</script>
</body>
</html>
