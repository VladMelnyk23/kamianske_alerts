<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Моніторинг тривог — Кам'янське</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .status-box { padding: 20px; border-radius: 10px; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .normal { background: #2e7d32; }
        .alert-ballistic { background: #c62828; animation: blink 1s infinite; }
        .alert-uav { background: #ef6c00; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .log-container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; }
        .log-item { border-bottom: 1px solid #333; padding: 8px 0; font-size: 14px; }
        .sound-btn { background: #ff5252; color: #fff; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h1>Моніторинг тривог: м. Кам'янське</h1>
    
    <button class="sound-btn" onclick="unlockAudio()">🔊 Увімкнути звук сирени</button>
    
    <div id="statusBox" class="status-box normal">Статус: Завантаження...</div>

    <audio id="alarmSound" src="https://actions.google.com/sounds/v1/alarms/emergency_alarm.ogg" preload="auto" loop></audio>

    <div class="log-container">
        <h3>Лог подій (останні до 10):</h3>
        <div id="logList">
            <div class="log-item">Підключення до серверах...</div>
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('statusBox');
        const alarmSound = document.getElementById('alarmSound');
        const logList = document.getElementById('logList');
        let audioUnlocked = false;

        function unlockAudio() {
            alarmSound.play().then(() => {
                alarmSound.pause();
                alarmSound.currentTime = 0;
                audioUnlocked = true;
                alert("Звук сирени активовано!");
            }).catch(e => console.log(e));
        }

        async function fetchStatus() {
            try {
                let response = await fetch('/status');
                let data = await response.json();

                // Оновлюємо статус на екрані
                if (data.current_status === 'ballistic') {
                    statusBox.className = 'status-box alert-ballistic';
                    statusBox.innerText = '🚨 БАЛІСТИЧНА ЗАГРОЗА У КАМ\'ЯНСЬКОМУ! 🚨';
                    if (audioUnlocked) alarmSound.play();
                } else if (data.current_status === 'uav') {
                    statusBox.className = 'status-box alert-uav';
                    statusBox.innerText = '⚠️ ЗАГРОЗА БПЛА У РЕГІОНІ';
                    if (audioUnlocked) alarmSound.play();
                } else {
                    statusBox.className = 'status-box normal';
                    statusBox.innerText = 'Статус: Спокійно';
                    alarmSound.pause();
                    alarmSound.currentTime = 0;
                }

                // Оновлюємо лог (список минулих подій)
                logList.innerHTML = '';
                if (data.logs && data.logs.length > 0) {
                    data.logs.forEach(item => {
                        let div = document.createElement('div');
                        div.className = 'log-item';
                        div.style.color = item.type === 'ballistic' ? '#ff5252' : (item.type === 'uav' ? '#ffa726' : '#fff');
                        div.innerText = `[${item.time}] ${item.text}`;
                        logList.appendChild(div);
                    });
                } else {
                    logList.innerHTML = '<div class="log-item">Подій поки немає. Спокійно.</div>';
                }

            } catch (e) {
                console.log("Помилка отримання даних:", e);
            }
        }

        // Опитуємо наш сервер на Railway кожні 5 секунд
        setInterval(fetchStatus, 5000);
        fetchStatus();
    </script>
</body>
</html>
