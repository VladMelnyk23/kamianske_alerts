<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тривога — Кам'янське</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8b949e; --ok:#238636; --warn:#d29922; --bad:#da3633; --line:#30363d; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:720px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:1.1rem; color:var(--muted); font-weight:500; margin:0 0 14px; }
  .status { border-radius:16px; padding:36px 20px; text-align:center; background:var(--ok); transition:background .3s; }
  .status.alert { background:#e3b100; color:#1a1300; animation:pulse 1.2s infinite; }
  .status.ballistic { background:#e5202a; animation:pulse .7s infinite; }
  .status.test { background:#1f6feb; animation:pulse 1.5s infinite; }
  .status.error { background:#4d4d4d; }
  .status .big { font-size:2rem; font-weight:700; }
  .status .sub { margin-top:8px; opacity:.9; }
  @keyframes pulse { 50% { filter:brightness(1.35); } }
  button { margin:14px 0; padding:10px 16px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:.95rem; cursor:pointer; }
  button.on { border-color:var(--ok); }
  h2 { font-size:1.05rem; margin:26px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; font-size:.92rem; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; }
  tr:last-child td { border-bottom:0; }
  .tag { padding:2px 8px; border-radius:6px; font-size:.8rem; background:var(--warn); color:#000; }
  .tag.b { background:var(--bad); color:#fff; }
  .tag.o { background:#6e7681; color:#fff; }
  .pill { display:inline-block; margin-top:12px; padding:6px 12px; border-radius:999px; background:var(--card); border:1px solid var(--line); font-size:.9rem; }
  .pill.alert { border-color:#e3b100; }
  .pill.ballistic { border-color:#e5202a; }
  .tag.t { background:#1f6feb; color:#fff; }
  tr.other td { color:var(--muted); }
  label.muted { display:block; margin:0 0 10px; }
  .wrap { overflow-x:auto; }
  .muted { color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>Моніторинг тривог · <span id="city">Кам'янське</span></h1>
  <div id="status" class="status">
    <div class="big" id="big">Завантаження…</div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="pill" id="district"></div>
  <button id="soundBtn">🔇 Увімкнути звук</button>
  <button id="testBtn">▶ Перевірити звук</button>
  <div class="muted" id="soundMsg"></div>
  <div class="muted" id="updated"></div>

  <h2>Журнал тривог і загроз</h2>
  <label class="muted"><input type="checkbox" id="otherToggle" checked> Показувати інші загрози та Дніпровський район (без сирени)</label>
  <div class="wrap">
    <table>
      <thead><tr><th>Початок</th><th>Кінець</th><th>Тривалість</th><th>Тип</th><th>Коментар</th></tr></thead>
      <tbody id="log"><tr><td colspan="5" class="muted">Завантаження…</td></tr></tbody>
    </table>
  </div>
</main>

<script>
const TZ = 'Europe/Kyiv';
const fmt = iso => iso ? new Date(iso).toLocaleString('uk-UA', {timeZone:TZ, day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
const dur = (a, b) => {
  const m = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 60000));
  return m >= 60 ? `${Math.floor(m/60)} год ${m%60} хв` : `${m} хв`;
};

const audio = new Audio('/alarm.mp3');
audio.preload = 'auto';
let soundOn = false, cur = 'ok', playedFor = null;
const btn = document.getElementById('soundBtn');
const testBtn = document.getElementById('testBtn');
const msg = document.getElementById('soundMsg');

audio.addEventListener('error', () => {
  msg.textContent = 'Не вдалося завантажити alarm.mp3: файл відсутній або пошкоджений.';
});

function tryPlay(loop) {
  audio.loop = loop;
  audio.currentTime = 0;
  const p = audio.play();
  if (p) p.then(() => { msg.textContent = ''; })
          .catch(e => { msg.textContent = 'Відтворення не вдалося: ' + e.name + ' ' + e.message; });
}

function syncSound() {
  if (cur === 'ok') { playedFor = null; audio.pause(); return; }
  if (!soundOn) { audio.pause(); return; }
  if (playedFor !== cur) { playedFor = cur; tryPlay(cur === 'ballistic'); }
}

btn.onclick = () => {
  soundOn = !soundOn;
  btn.classList.toggle('on', soundOn);
  btn.textContent = soundOn ? '🔊 Звук увімкнено' : '🔇 Увімкнути звук';
  playedFor = null;
  if (soundOn) syncSound(); else audio.pause();
};

testBtn.onclick = () => {
  tryPlay(false);
  setTimeout(() => { if (cur === 'ok' || !soundOn) audio.pause(); }, 4000);
};

async function loadStatus() {
  const box = document.getElementById('status'), big = document.getElementById('big'), sub = document.getElementById('sub');
  try {
    const s = await (await fetch('/api/status')).json();
    document.getElementById('city').textContent = s.city;
    cur = 'ok';
    if (s.ballistic) cur = 'ballistic'; else if (s.active) cur = 'alert';
    box.className = 'status ' + (s.test ? 'test' : (cur === 'ok' ? '' : cur));
    if (cur === 'ballistic') { big.textContent = '🚀 БАЛІСТИЧНА ЗАГРОЗА'; sub.textContent = 'Негайно в укриття! З ' + fmt(s.since); }
    else if (cur === 'alert') { big.textContent = '⚠️ ПОВІТРЯНА ТРИВОГА'; sub.textContent = 'З ' + fmt(s.since); }
    else { big.textContent = '✅ Зараз тихо'; sub.textContent = ''; }
    if (s.test) big.textContent = '🧪 ТЕСТ: ' + big.textContent.replace(/^\S+\s/, '');
    if (s.test) sub.textContent += ' · ТЕСТ, реальної загрози немає';
    const d = s.district || {};
    const dEl = document.getElementById('district');
    if (d.name) {
      dEl.className = 'pill ' + (d.ballistic ? 'ballistic' : d.active ? 'alert' : '');
      dEl.textContent = d.name + ': ' + (d.ballistic ? '🔴 балістична загроза' : d.active ? '🟡 повітряна тривога' : '🟢 тихо');
    }
    document.getElementById('updated').textContent = s.error ? 'Помилка джерела даних: ' + s.error : 'Оновлено: ' + fmt(s.updated);

    syncSound();
  } catch (e) {
    box.className = 'status error';
    big.textContent = 'Немає зв\'язку із сервером';
    sub.textContent = '';
  }
}

let showOther = true;
document.getElementById('otherToggle').onchange = e => { showOther = e.target.checked; loadLog(); };
const TYPES = {air_raid:'Повітряна', chemical:'Хімічна', radiation:'Радіаційна', other:'Інша'};

async function loadLog() {
  const tbody = document.getElementById('log');
  try {
    let rows = await (await fetch('/api/log')).json();
    rows = rows.filter(r => showOther || (r.category !== 'other' && r.category !== 'district'));
    tbody.innerHTML = '';
    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="muted">Записів ще немає</td></tr>'; return; }
    for (const r of rows) {
      const other = r.category === 'other';
      const isTest = r.category === 'test';
      const tr = document.createElement('tr');
      if (other || isTest) tr.className = 'other';
      const cells = [fmt(r.started_at), r.ended_at ? fmt(r.ended_at) : 'триває', dur(r.started_at, r.ended_at)];
      for (const c of cells) { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); }
      const td = document.createElement('td');
      const tag = document.createElement('span');
      if (isTest) { tag.className = 'tag t'; tag.textContent = r.ballistic ? 'Тест (балістика)' : 'Тест'; }
      else if (other) { tag.className = 'tag o'; tag.textContent = TYPES[r.alert_type] || 'Інша загроза'; }
      else { tag.className = 'tag' + (r.ballistic ? ' b' : ''); tag.textContent = r.ballistic ? 'Балістика' : 'Повітряна'; }
      td.appendChild(tag); tr.appendChild(td);
      const cm = document.createElement('td');
      cm.textContent = (other || r.category === 'district') ? [r.location, r.notes].filter(Boolean).join(' — ') : (r.notes || '');
      tr.appendChild(cm);
      tbody.appendChild(tr);
    }
  } catch (e) {}
}

loadStatus(); loadLog();
setInterval(loadStatus, 10000);
setInterval(loadLog, 30000);
</script>
</body>
</html>
