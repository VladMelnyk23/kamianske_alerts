<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Моніторинг тривог — Кам'янське</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 20px; }
        .status-box { padding: 20px; border-radius: 10px; font-size: 24px; font-weight: bold; margin-bottom: 20px; }
        .normal { background: #2e7d32; }
        .alert-ballistic { background: #c62828; animation: blink 1s infinite; }
        .alert-uav { background: #ef6c00; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .log-container { max-width: 600px; margin: 0 auto; background: #1e1e1e; padding: 15px; border-radius: 8px; text-align: left; }
        .log-item { border-bottom: 1px solid #333; padding: 8px 0; font-size: 14px; }
        .btn-container { margin-bottom: 20px; }
        .sound-btn { background: #ff5252; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; transition: 0.3s; }
        .sound-btn.active { background: #2e7d32; }
        .mute-btn { background: #d32f2f; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; display: none; }
    </style>
</head>
<body>

    <h1>Моніторинг тривог: м. Кам'янське</h1>
    
    <div class="btn-container">
        <button id="enableBtn" class="sound-btn" onclick="unlockAudio()">🔊 Дозволити звук сирени</button>
        <button id="muteBtn" class="mute-btn" onclick="toggleMute()">🔕 Вимкнути сирену зараз</button>
    </div>
    
    <div id="statusBox" class="status-box normal">Статус: Завантаження...</div>

    <audio id="alarmSound" src="alarm.mp3" preload="auto" loop></audio>

    <div class="log-container">
        <h3>Лог подій (останні до 10):</h3>
        <div id="logList">
            <div class="log-item">Підключення до сервера...</div>
        </div>
    </div>

    <script>
        const statusBox = document.getElementById('statusBox');
        const alarmSound = document.getElementById('alarmSound');
        const logList = document.getElementById('logList');
        const enableBtn = document.getElementById('enableBtn');
        const muteBtn = document.getElementById('muteBtn');

        let audioAllowed = false;
        let soundManuallyMuted = false;

        function unlockAudio() {
            alarmSound.play().then(() => {
                alarmSound.pause();
                alarmSound.currentTime = 0;
                audioAllowed = true;
                soundManuallyMuted = false;
                
                enableBtn.className = 'sound-btn active';
                enableBtn.innerText = '✅ Звук активовано';
                muteBtn.style.display = 'inline-block';
            }).catch(e => {
                console.log("Помилка аудіо:", e);
                alert("Не вдалося знайти файл alarm.mp3 або браузер заблокував звук.");
            });
        }

        function toggleMute() {
            soundManuallyMuted = true;
            alarmSound.pause();
            alarmSound.currentTime = 0;
            muteBtn.style.backgroundColor = '#555';
            muteBtn.innerText = '🔇 Сирену вимкнено (до наступної тривоги)';
        }

        async function fetchStatus() {
            try {
                let response = await fetch('/status');
                let data = await response.json();

                if (data.current_status === 'ballistic') {
                    statusBox.className = 'status-box alert-ballistic';
                    statusBox.innerText = '🚨 БАЛІСТИЧНА ЗАГРОЗА У КАМ\'ЯНСЬКОМУ! 🚨';
                    
                    if (audioAllowed && !soundManuallyMuted && alarmSound.paused) {
                        alarmSound.play().catch(err => console.log("Помилка відтворення:", err));
                    }
                } else if (data.current_status === 'uav') {
                    statusBox.className = 'status-box alert-uav';
                    statusBox.innerText = '⚠️ ЗАГРОЗА БПЛА У РЕГІОНІ';
                    if (audioAllowed && !soundManuallyMuted && alarmSound.paused) {
                        alarmSound.play().catch(err => console.log("Помилка відтворення:", err));
                    }
                } else {
                    statusBox.className = 'status-box normal';
                    statusBox.innerText = 'Статус: Спокійно';
                    
                    soundManuallyMuted = false;
                    muteBtn.style.backgroundColor = '#d32f2f';
                    muteBtn.innerText = '🔕 Вимкнути сирену зараз';

                    alarmSound.pause();
                    alarmSound.currentTime = 0;
                }

                // Оновлення логу подій з кольоровим виділенням балістики
                logList.innerHTML = '';
                if (data.logs && data.logs.length > 0) {
                    data.logs.forEach(item => {
                        let div = document.createElement('div');
                        div.className = 'log-item';
                        
                        // Балістика виділяється яскраво-червоним, БПЛА — помаранчевим, відбій — зеленим/білим
                        if (item.type === 'ballistic') {
                            div.style.color = '#ff5252';
                            div.style.fontWeight = 'bold';
                        } else if (item.type === 'uav') {
                            div.style.color = '#ffa726';
                        } else {
                            div.style.color = '#81c784';
                        }

                        div.innerText = `[${item.time}] ${item.text}`;
                        logList.appendChild(div);
                    });
                } else {
                    logList.innerHTML = '<div class="log-item">Подій поки немає. Спокійно.</div>';
                }

            } catch (e) {
                console.log("Помилка з'єднання:", e);
            }
        }

        setInterval(fetchStatus, 5000);
        fetchStatus();
    </script>
</body>
</html>
